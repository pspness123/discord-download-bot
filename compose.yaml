services:
  deep-download-service:
    build: .
    container_name: deep-download-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./temp_jobs:/app/temp_jobs
    command: python -m uvicorn api_service:app --host 0.0.0.0 --port 8000

  deep-discord-bot:
    build: .
    container_name: deep-discord-bot
    env_file:
      - .env
    environment:
      API_BASE_URL: http://deep-download-service:8000
    depends_on:
      - deep-download-service
    command: python main.py